[project]
name = "mcp-analysis"
version = "0.1.0"
description = "Analyze MCP tool token consumption across coding AI CLIs"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Tim Messerschmidt", email = "timmesserschmidt@gmail.com" }]
keywords = ["mcp", "token", "analysis", "context-window", "opencode", "gemini", "claude", "codex"]

dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "tiktoken>=0.8",
    "mcp>=1.0",
    "httpx>=0.27",
]

[project.scripts]
mcp-analysis = "mcp_analysis.cli:main"

[project.urls]
Homepage = "https://github.com/SeraphimSerapis/mcp-analysis"
Repository = "https://github.com/SeraphimSerapis/mcp-analysis"
Issues = "https://github.com/SeraphimSerapis/mcp-analysis/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
